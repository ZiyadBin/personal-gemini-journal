<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <!-- Circular clip mask -->
    <clipPath id="circleClip">
      <circle cx="100" cy="100" r="98" />
    </clipPath>

    <!-- Celestial Sunset/Dusk sky gradient -->
    <linearGradient id="twilightSky" x1="15%" y1="10%" x2="85%" y2="90%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="35%" stop-color="#4f46e5" />
      <stop offset="65%" stop-color="#9333ea" />
      <stop offset="85%" stop-color="#f472b6" />
      <stop offset="100%" stop-color="#fcd34d" />
    </linearGradient>

    <!-- Deep indigo outer wave gradient -->
    <linearGradient id="deepBlueWave" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1d4ed8" />
      <stop offset="50%" stop-color="#1e40af" />
      <stop offset="100%" stop-color="#172554" />
    </linearGradient>

    <!-- Bright cyan inner wave gradient -->
    <linearGradient id="cyanBlueWave" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="60%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#60a5fa" />
    </linearGradient>

    <!-- Bottom dusk hill gradient -->
    <linearGradient id="duskHill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" />
      <stop offset="40%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
  </defs>

  <!-- Masked Circular Emblem -->
  <g clip-path="url(#circleClip)">
    <!-- Base Sky Gradient -->
    <rect width="200" height="200" fill="url(#twilightSky)" />

    <!-- Dusk rolling hills at bottom right -->
    <path d="M 90 200 C 130 160 170 145 200 152 L 200 200 Z" fill="url(#duskHill)" opacity="0.9" />
    <path d="M 120 200 C 150 175 180 170 200 175 L 200 200 Z" fill="#2563eb" opacity="0.85" />

    <!-- Radiant 4-point Diamond Star -->
    <g transform="translate(142, 60)">
      <!-- Soft star halo -->
      <circle cx="0" cy="0" r="14" fill="#ffffff" opacity="0.25" />
      <!-- Star rays -->
      <path d="M 0 -18 Q 0 0 -18 0 Q 0 0 0 18 Q 0 0 18 0 Q 0 0 0 -18 Z" fill="#fffdfa" />
      <circle cx="0" cy="0" r="2.5" fill="#ffffff" />
    </g>

    <!-- Serene Face Profile & Neck (White Silhouette) -->
    <!-- Head curving from top center, gentle forehead, nose, lips, chin, throat -->
    <path d="M 88 38
             C 105 45 118 62 122 75
             C 123 78 120 83 124 87
             C 128 90 134 92 135 94
             C 134 96 131 97 131 99
             C 133 101 133 105 131 107
             C 129 108 132 112 131 115
             C 129 122 124 127 122 130
             C 117 137 110 147 104 160
             C 99 170 96 182 96 195
             C 95 198 94 200 92 200
             C 90 185 86 160 84 140
             C 80 115 82 85 85 55
             Z" fill="#ffffff" />

    <!-- Delicate Closed Eye & Eyelashes -->
    <path d="M 101 88 C 106 91 112 91 116 88" stroke="#1e1b4b" stroke-width="2.5" stroke-linecap="round" fill="none" />

    <!-- Flowing Hair Waves & Petals -->
    <!-- 1. Top Crown Sweep (Deep Royal Blue) -->
    <path d="M 28 85
             C 38 48 70 30 92 40
             C 78 50 68 70 66 92
             C 52 75 38 78 28 85 Z" fill="#2563eb" />

    <!-- 2. Main Flowing Hair Lock (Deep Cobalt / Indigo) -->
    <path d="M 28 85
             C 50 80 72 105 76 135
             C 85 110 84 75 92 40
             C 108 48 116 65 114 80
             C 105 85 96 100 95 118
             C 94 135 98 152 96 175
             C 92 165 85 155 75 145
             C 65 135 45 125 35 118
             Z" fill="url(#deepBlueWave)" />

    <!-- 3. Vibrant Azure Inner Lock (Cyan/Light Blue highlight) -->
    <path d="M 75 108
             C 80 120 85 140 96 170
             C 92 155 88 135 84 125
             C 80 115 76 110 75 108 Z" fill="url(#cyanBlueWave)" />
    <path d="M 75 108
             C 85 115 95 125 96 145
             C 94 158 90 170 96 182
             C 88 165 80 148 75 130 Z" fill="#38bdf8" opacity="0.85" />

    <!-- 4. Front Elegant White Petal / Leaf -->
    <path d="M 44 70
             C 55 90 58 118 73 135
             C 62 125 52 105 44 70 Z" fill="#ffffff" />

    <!-- 5. Bottom swooping arc wave in navy blue -->
    <path d="M 28 132
             C 45 132 75 148 95 178
             C 80 168 55 155 28 155 Z" fill="#ffffff" opacity="0.9" />
    <path d="M 28 132
             C 50 135 78 155 95 198
             C 72 175 42 165 28 165 Z" fill="#1e3a8a" />
    <path d="M 26 132
             C 45 132 80 155 96 200
             C 65 195 40 180 26 160 Z" fill="#172554" />
  </g>

  <!-- Fine Outer Ring subtle accent -->
  <circle cx="100" cy="100" r="98" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="1.5" />
</svg>
